name: CI

on:
  push:
    branches: [main, 'feat/**', 'fix/**']
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: API Laravel (Pest + PostGIS)
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgis/postgis:16-3.4
        env:
          POSTGRES_USER: nanpuno
          POSTGRES_PASSWORD: nanpuno
          POSTGRES_DB: nanpuno_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U nanpuno"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      APP_ENV: testing
      DB_CONNECTION: pgsql
      DB_HOST: 127.0.0.1
      DB_PORT: 5432
      DB_DATABASE: nanpuno_test
      DB_USERNAME: nanpuno
      DB_PASSWORD: nanpuno
      DB_PERSISTENT: 'false'
    steps:
      - uses: actions/checkout@v4

      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          extensions: pdo_pgsql, pgsql, mbstring, intl, fileinfo
          coverage: none

      - name: Caché de Composer
        uses: actions/cache@v4
        with:
          path: vendor
          key: composer-${{ hashFiles('composer.lock') }}

      - run: composer install --no-interaction --prefer-dist --no-progress

      - name: Preparar entorno
        run: |
          cp .env.example .env
          php artisan key:generate

      # Solo avisa: el código aún no se formateó con Pint. Tras correr `vendor/bin/pint`
      # una vez y commitear, quita continue-on-error para que el estilo sea obligatorio.
      - name: Estilo (Pint)
        run: vendor/bin/pint --test
        continue-on-error: true

      - name: Migraciones
        run: php artisan migrate --force

      - name: Pruebas
        run: php artisan test

  frontend:
    name: Frontend React
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - run: npm ci
      - run: npx oxlint src
      - run: npm run build
